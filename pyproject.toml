[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "cython"
]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Alen Buhanec", email = "alen.buhanec@gmail.com"}]
name = "spookyhash"
description = "A Python wrapper for SpookyHash version 2"
readme = "README.md"
keywords = ["SpookyHash", "hashlib"]
license = "MIT"
classifiers = [
    "Topic :: Software Development :: Libraries",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/buhanec/spookyhash"
Repository = "https://github.com/buhanec/spookyhash"
Issues = "https://github.com/buhanec/spookyhash/issues"

[project.optional-dependencies]
typing = [
    "mypy>=1.18",
    "typing-extensions",
]
test = [
    "pytest",
    "hypothesis",
    # only publishes win_arm64 wheels for CPython 3.11+
    "numpy; python_version >= '3.11' or sys_platform != 'win32' or platform_machine != 'ARM64'",
]

[tool.setuptools]
packages = ["spookyhash"]

[tool.setuptools.package-data]
spookyhash = ["py.typed", "_spookyhash.pyi"]

[tool.setuptools.dynamic]
version = {attr = "spookyhash.__version__"}
